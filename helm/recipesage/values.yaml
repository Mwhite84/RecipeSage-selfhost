# This chart uses the bjw-s/k8s-at-home common library chart.
# Default values: https://github.com/bjw-s/helm-charts/tree/main/charts/library/common/values.yaml

# -- Override the default chart name
nameOverride: ""
# -- Override the full chart name
fullnameOverride: ""

global:
  labels: {}

controllers:
  proxy:
    containers:
      proxy:
        image:
          repository: julianpoy/recipesage-selfhost-proxy
          tag: v4.0.0
          pullPolicy: Always
        ports:
          - name: http
            containerPort: 80

  static:
    containers:
      static:
        image:
          #repository: 192.168.0.225:30500/recipesage-static
          #tag: v1.3.3
          repository: 192.168.0.225:30500/recipesage-static
          # v1.5.0 (upstream merge) is built and pushed, but BLOCKED: the master
          # frontend calls trpc procedures api.recipesage.com does not expose
          # (recipes.getRecipeCount, users.getMyCapabilities) -> blocking
          # "Resource Not Found" modal on every page. See
          # recipesage/docs/upstream-merge-decisions.md
          tag: v1.4.0
          #repository: recipesage-selfhost
          #tag: static-selfhost-20260220
          pullPolicy: Always
        env:
          NODE_ENV: selfhost
        ports:
          - name: http
            containerPort: 80

  api:
    initContainers:
      wait-postgres:
        image:
          repository: postgres
          tag: "16"
        command:
          - sh
          - -c
        args:
          - until pg_isready -h recipesage-postgres -p 5432 -U recipesage_selfhost; do sleep 2; done
    containers:
      api:
        image:
          #repository: julianpoy/recipesage-selfhost
          #tag: api-v3.0.10
          repository: 192.168.0.225:30500/recipesage-api
          # v3.1.0-custom is built from the same merged commit as static v1.5.0,
          # so frontend and backend are the same version by construction — this is
          # what removes the cloud API skew for good.
          tag: v3.1.0-custom
          pullPolicy: Always
        command:
          - sh
          - -c
        args:
          - npx prisma migrate deploy; npx nx seed prisma; node dist/apps/backend/main.cjs
        env:
          STORAGE_TYPE: filesystem
          FILESYSTEM_STORAGE_PATH: /rs-media
          NODE_ENV: selfhost
          VERBOSE: "false"
          VERSION: selfhost
          POSTGRES_DB: recipesage_selfhost
          POSTGRES_USER: recipesage_selfhost
          POSTGRES_PASSWORD: recipesage_selfhost
          POSTGRES_PORT: "5432"
          POSTGRES_HOST: "{{ include \"bjw-s.common.lib.chart.names.fullname\" . }}-postgres"
          POSTGRES_SSL: "false"
          POSTGRES_LOGGING: "false"
          DATABASE_URL: "postgresql://recipesage_selfhost:recipesage_selfhost@{{ include \"bjw-s.common.lib.chart.names.fullname\" . }}-postgres:5432/recipesage_selfhost"
          GCM_KEYPAIR: ""
          SENTRY_DSN: ""
          GRIP_URL: "http://{{ include \"bjw-s.common.lib.chart.names.fullname\" . }}-pushpin:5561/"
          GRIP_KEY: changeme
          STRIPE_SK: ""
          STRIPE_WEBHOOK_SECRET: ""
          INGREDIENT_INSTRUCTION_CLASSIFIER_URL: "http://{{ include \"bjw-s.common.lib.chart.names.fullname\" . }}-ingredient-instruction-classifier:3000/"
          OPENAI_API_KEY: ""
          JOB_QUEUE_WORKER_PATH: "/app/dist/apps/queue-worker/worker.cjs"
          # Newly REQUIRED by the merged backend. config.ts throws
          # "Missing required environment variable" at startup if any of these
          # are unset (getEnvString with Environment.All / AllRuntime), which is
          # what crashlooped v3.1.0-custom on first deploy.
          # Public base of the API as seen by browsers: the proxy maps /api/ -> api:3000
          API_PUBLIC_BASE_URL: "https://recipes.levenite.com/api/"
          # AI model routing. Values mirror upstream example.env. These only need
          # to be SET for config validation to pass; the features themselves are
          # inert without an AI provider key, which is fine for a family instance.
          AI_PROVIDER: openrouter
          AI_MODEL_WEBPAGE: google/gemini-2.5-flash-lite
          AI_MODEL_TEXT: google/gemini-2.5-flash-lite
          AI_MODEL_OCR: google/gemini-2.5-flash
          AI_MODEL_DOCUMENT: google/gemini-2.5-flash
          AI_MODEL_VISION: anthropic/claude-sonnet-4.6
          AI_MODEL_MODERATION: google/gemini-2.5-flash
          AI_MODEL_NUTRITION: google/gemini-2.5-flash-lite
          AI_MODEL_ASSISTANT: anthropic/claude-sonnet-4.6
          AI_MODEL_ASSISTANT_LOW: google/gemini-2.5-flash
          JOB_QUEUE_REDIS_HOST: "{{ include \"bjw-s.common.lib.chart.names.fullname\" . }}-redis"
          JOB_QUEUE_REDIS_PORT: "6379"
        ports:
          - name: http
            containerPort: 3000

  # Typesense removed: upstream deleted the pluggable search layer entirely
  # (elasticsearch/meilisearch/typesense) in favour of Postgres FTS + trigram.
  # Redis replaces it here as the BullMQ job-queue backend, which the API
  # requires (packages/util/server/src/general/queue).
  redis:
    containers:
      redis:
        image:
          repository: redis
          tag: 7-alpine
          pullPolicy: IfNotPresent
        ports:
          - name: redis
            containerPort: 6379

  pushpin:
    containers:
      pushpin:
        image:
          repository: julianpoy/pushpin
          tag: 2023-09-17
          pullPolicy: IfNotPresent
        command:
          - /bin/sh
          - -c
        args:
          - sed -i "s/sig_key=changeme/sig_key=$$GRIP_KEY/" /etc/pushpin/pushpin.conf && echo "* $${TARGET},over_http" > /etc/pushpin/routes && pushpin --merge-output
        env:
          GRIP_KEY: changeme
          TARGET: "{{ include \"bjw-s.common.lib.chart.names.fullname\" . }}-api:3000"
        ports:
          - name: grip
            containerPort: 5561
          - name: ws
            containerPort: 7999

  postgres:
    containers:
      postgres:
        image:
          repository: postgres
          tag: "16"
          pullPolicy: IfNotPresent
        env:
          POSTGRES_DB: recipesage_selfhost
          POSTGRES_USER: recipesage_selfhost
          POSTGRES_PASSWORD: recipesage_selfhost
        ports:
          - name: postgres
            containerPort: 5432

  browserless:
    containers:
      browserless:
        image:
          repository: ghcr.io/browserless/chromium
          tag: v2.24.3
          pullPolicy: IfNotPresent
        env:
          MAX_CONCURRENT_SESSIONS: "3"
          MAX_QUEUE_LENGTH: "10"
        ports:
          - name: http
            containerPort: 3000

  ingredient-instruction-classifier:
    enabled: false
    containers:
      ingredient-instruction-classifier:
        image:
          repository: julianpoy/ingredient-instruction-classifier
          tag: 1.4.11
          pullPolicy: IfNotPresent
        env:
          SENTENCE_EMBEDDING_BATCH_SIZE: "200"
          PREDICTION_CONCURRENCY: "2"
        ports:
          - name: http
            containerPort: 3000

service:
  proxy:
    controller: proxy
    primary: true
    ports:
      http:
        port: 80

  static:
    controller: static
    ports:
      http:
        port: 80

  api:
    controller: api
    ports:
      http:
        port: 3000

  redis:
    controller: redis
    ports:
      redis:
        port: 6379

  pushpin:
    controller: pushpin
    ports:
      grip:
        port: 5561
      ws:
        port: 7999

  postgres:
    controller: postgres
    ports:
      postgres:
        port: 5432

  browserless:
    controller: browserless
    ports:
      http:
        port: 3000

  ingredient-instruction-classifier:
    enabled: false
    controller: ingredient-instruction-classifier
    ports:
      http:
        port: 3000

# Kong will handle ingress
ingress:
  main:
    enabled: false

persistence:
  proxy-config:
    enabled: true
    type: configMap
    name: "{{ include \"bjw-s.common.lib.chart.names.fullname\" . }}-proxy-config"
    advancedMounts:
      proxy:
        proxy:
          - path: /etc/nginx/conf.d/default.conf
            subPath: default.conf

  apimedia:
    enabled: true
    type: persistentVolumeClaim
    existingClaim: recipesage-apimedia
    advancedMounts:
      api:
        api:
          - path: /rs-media

  # recipesage-typesensedata PVC deliberately left in the cluster but unmounted:
  # it costs a little disk and buys a rollback path. Delete it once v1.5.0 has
  # been stable for a while.
  typesensedata:
    enabled: false
    type: persistentVolumeClaim
    existingClaim: recipesage-typesensedata

  postgresdata:
    enabled: true
    type: persistentVolumeClaim
    existingClaim: recipesage-postgresdata
    advancedMounts:
      postgres:
        postgres:
          - path: /var/lib/postgresql/data

resources: {}
